const KEY='ledger365_simple_v3';let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!db||!Array.isArray(db.incomes)||!Array.isArray(db.expenses))db={incomes:[],expenses:[],categories:[],version:3};if(!db.monthIndependentV1){let converted=[];for(let x of db.expenses){let months=new Set([x.month]);for(let [k,v] of Object.entries(x.paid||{}))if(v&&/^\d{4}-\d{2}$/.test(k))months.add(k);for(let k of months){if(!/^\d{4}-\d{2}$/.test(k))continue;converted.push({id:k===x.month?x.id:x.id+'_'+k.replace('-',''),name:x.name,amount:Number(x.monthAmounts&&Object.prototype.hasOwnProperty.call(x.monthAmounts,k)?x.monthAmounts[k]:x.amount||0),category:x.category||'',note:x.note||'',month:k,paid:{[k]:!!(x.paid&&x.paid[k])}})}}db.expenses=converted;db.monthIndependentV1=true;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){console.warn('迁移保存失败',e)}}
let today=new Date(),year=today.getFullYear(),month=today.getMonth()+1,tab='expense',edit=null,annualYear=year;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}),mk=(y,m)=>y+'-'+String(m).padStart(2,'0'),key=()=>mk(year,month),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('手机存储失败，请检查浏览器存储空间。')}},uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8),toast=s=>{let t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)},shift=n=>{let d=new Date(year,month-1+n,1);year=d.getFullYear();month=d.getMonth()+1;render()},incFor=(y,m)=>db.incomes.filter(x=>x.month===mk(y,m)),expFor=(y,m)=>db.expenses.filter(x=>x.month===mk(y,m)),isPaid=(x,y,m)=>!!(x.paid&&x.paid[mk(y,m)]),amountFor=(x,y,m)=>Number(x.monthAmounts&&Object.prototype.hasOwnProperty.call(x.monthAmounts,mk(y,m))?x.monthAmounts[mk(y,m)]:x.amount||0),summary=(y,m)=>{let i=incFor(y,m).reduce((s,x)=>s+x.amount,0),xs=expFor(y,m),p=xs.filter(x=>isPaid(x,y,m)).reduce((s,x)=>s+amountFor(x,y,m),0),all=xs.reduce((s,x)=>s+amountFor(x,y,m),0);return {income:i,paid:p,pending:all-p,total:all,balance:i-p,forecast:i-all}},stat=(label,n,cls='')=>`<div class="stat ${cls}"><label>${label}</label><strong>${fmt(n)}</strong></div>`,summaryCards=s=>`<div class="grid">${stat('总收入',s.income)}${stat('总支出',s.paid)}${stat('余额',s.balance,'wide')}</div>`;
function render(){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));$('monthLabel').textContent=year+'年 '+month+'月';let out='';if(tab==='income')out=incomeView();if(tab==='expense')out=expenseView();if(tab==='stats')out=statsView();if(tab==='settings')out=settingsView();$('content').innerHTML=out}
function incomeView(){let xs=incFor(year,month).slice().sort((a,b)=>b.date.localeCompare(a.date)),s=summary(year,month);return `<h2>收入</h2><div class="panel">${stat('本月总收入',s.income)}</div><button class="btn full" onclick="incomeForm()">＋ 新增收入</button><div class="panel"><h2>收入明细</h2>${xs.length?xs.map(x=>`<div class="row"><div class="rowmain"><b>${esc(x.name)}</b><div class="muted">${esc(x.date)}${x.note?' · '+esc(x.note):''}</div></div><div><div class="amount green">${fmt(x.amount)}</div><div class="actions"><button class="btn light small" onclick="incomeForm('${x.id}')">修改</button><button class="btn outline small" onclick="delIncome('${x.id}')">删除</button></div></div></div>`).join(''):'<p class="hint">还没有收入记录，点击上方新增。</p>'}</div>`}
function expenseView(){let xs=expFor(year,month),s=summary(year,month);return `<h2>支出 · 付款清单</h2><div class="grid">${stat('还需要付款',s.pending)}${stat('已经付款',s.paid)}</div><div class="panel"><div class="hint">本月应付 ${fmt(s.total)} · 完成 ${s.total?Math.round(s.paid/s.total*100):0}%</div><div class="bar" style="margin:10px 0"><div style="width:${s.total?s.paid/s.total*100:0}%"></div></div><button class="btn full" onclick="expenseForm()">＋ 新增付款项目</button>${xs.length?xs.map(x=>`<div class="row"><input class="check" type="checkbox" aria-label="确认${esc(x.name)}付款" ${isPaid(x,year,month)?'checked':''} onchange="togglePaid('${x.id}',this.checked)"><div class="rowmain"><b style="${isPaid(x,year,month)?'text-decoration:line-through;color:#9d9097':''}">${esc(x.name)}</b><div class="muted">${esc(x.category||'未分类')}${x.note?' · '+esc(x.note):''}</div></div><div><div class="amount ${isPaid(x,year,month)?'green':''}">${fmt(amountFor(x,year,month))}</div><div class="actions"><button class="btn light small" onclick="expenseForm('${x.id}')">修改</button><button class="btn outline small" onclick="delExpense('${x.id}')">删除</button></div></div></div>`).join(''):'<p class="hint">先把需要付款的项目写下来，付了就打勾。</p>'}</div>`}
function incomeForm(id){let x=db.incomes.find(z=>z.id===id)||{name:'',amount:'',date:mk(year,month)+'-'+String(Math.min(today.getDate(),new Date(year,month,0).getDate())).padStart(2,'0'),note:''};edit={type:'income',id};$('content').innerHTML=`<h2>${id?'修改':'新增'}收入</h2><form onsubmit="saveIncome(event)"><label>收入名称</label><input name="name" required value="${esc(x.name)}"><label>金额（RM）</label><input name="amount" type="number" min="0.01" step="0.01" required value="${esc(x.amount)}"><label>收入日期</label><input name="date" type="date" required value="${esc(x.date)}"><label>备注（选填）</label><textarea name="note">${esc(x.note)}</textarea><div class="actions"><button type="button" class="btn light" onclick="render()">取消</button><button class="btn" type="submit">保存收入</button></div></form>`}
function saveIncome(e){e.preventDefault();let f=e.target,x={id:edit.id||uid(),name:f.elements.namedItem('name').value.trim(),amount:Number(f.elements.namedItem('amount').value),date:f.elements.namedItem('date').value,month:f.elements.namedItem('date').value.slice(0,7),note:f.elements.namedItem('note').value.trim()};if(!x.name||!(x.amount>0))return;db.incomes=edit.id?db.incomes.map(z=>z.id===edit.id?x:z):[...db.incomes,x];save();year=Number(x.month.slice(0,4));month=Number(x.month.slice(5));render();toast('收入已保存')}
function expenseForm(id){let x=db.expenses.find(z=>z.id===id)||{name:'',amount:'',category:'',note:''};edit={type:'expense',id};$('content').innerHTML=`<h2>${id?'修改':'新增'}付款项目</h2><form onsubmit="saveExpense(event)"><label>付款名称</label><input name="name" required value="${esc(x.name)}"><label>金额（RM）</label><input name="amount" type="number" min="0.01" step="0.01" required value="${esc(id?amountFor(x,year,month):x.amount)}"><label>分类</label><select name="category"><option value="">未分类</option>${db.categories.map(c=>`<option value="${esc(c)}" ${x.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><label>备注（选填）</label><textarea name="note">${esc(x.note)}</textarea><div class="actions"><button type="button" class="btn light" onclick="render()">取消</button><button class="btn" type="submit">保存项目</button></div></form>`}
function saveExpense(e){e.preventDefault();let f=e.target,old=db.expenses.find(z=>z.id===edit.id),newAmount=Number(f.elements.namedItem('amount').value),x={id:edit.id||uid(),name:f.elements.namedItem('name').value.trim(),amount:newAmount,category:f.elements.namedItem('category').value,note:f.elements.namedItem('note').value.trim(),month:key(),paid:{[key()]:old?isPaid(old,year,month):false}};if(!x.name||!Number.isFinite(newAmount)||newAmount<=0)return;if(old&&old.month!==key())return toast('只能修改本月项目');db.expenses=edit.id?db.expenses.map(z=>z.id===edit.id?x:z):[...db.expenses,x];save();render();toast('已保存，仅影响本月')}
function togglePaid(id,checked){let x=db.expenses.find(z=>z.id===id);if(!x)return;x.paid=x.paid||{};x.paid[key()]=checked;save();render()}
function delIncome(id){if(confirm('确定删除这笔收入吗？')){db.incomes=db.incomes.filter(x=>x.id!==id);save();render()}}
function delExpense(id){if(confirm('确定删除本月这个付款项目吗？')){db.expenses=db.expenses.filter(x=>x.id!==id);save();render()}}
function categoryStats(y,m){let totals=new Map(db.categories.map(c=>[c,0]));for(let x of expFor(y,m)){if(!isPaid(x,y,m))continue;let c=x.category||'未分类';totals.set(c,(totals.get(c)||0)+amountFor(x,y,m))}return [...totals.entries()].filter(([c,v])=>v>0||db.categories.includes(c)).sort((a,b)=>b[1]-a[1])}
function annualCategoryStats(y){let totals=new Map(db.categories.map(c=>[c,0]));for(let m=1;m<=12;m++)for(let [c,v] of categoryStats(y,m))totals.set(c,(totals.get(c)||0)+v);return [...totals.entries()].sort((a,b)=>b[1]-a[1])}
function categoryPanel(rows,title){return `<div class="panel"><h2>${title}</h2>${rows.length?rows.map(([c,v])=>`<div class="row"><div class="rowmain"><b>${esc(c)}</b></div><div class="amount">${fmt(v)}</div></div>`).join(''):'<p class="hint">暂无分类记录</p>'}</div>`}
function statsView(){let s=summary(year,month),months=Array.from({length:12},(_,i)=>summary(annualYear,i+1)),sum=months.reduce((a,x)=>({income:a.income+x.income,paid:a.paid+x.paid,balance:a.balance+x.balance}),{income:0,paid:0,balance:0});return `<h2>每月统计</h2><div class="panel">${summaryCards(s)}${categoryPanel(categoryStats(year,month),"本月支出分类统计")}<button style="margin-top:14px" class="btn full" onclick="exportReceipt('month')">📷 生成月结账单图片</button></div><div class="panel"><div class="month"><button onclick="annualYear--;render()">‹</button><b>${annualYear}年 · 年度统计</b><button onclick="annualYear++;render()">›</button></div>${summaryCards(sum)}${categoryPanel(annualCategoryStats(annualYear),"全年支出分类统计")}<h2 style="margin-top:20px">12个月收支明细</h2><div class="tablewrap"><table><thead><tr><th>月份</th><th>收入</th><th>支出</th><th>余额</th></tr></thead><tbody>${months.map((x,i)=>`<tr><td>${i+1}月</td><td>${x.income.toFixed(2)}</td><td>${x.paid.toFixed(2)}</td><td>${x.balance.toFixed(2)}</td></tr>`).join('')}</tbody></table></div><button class="btn full" style="margin-top:15px" onclick="exportReceipt('year')">📷 生成年度账单图片</button></div><p class="hint">余额＝收入－实际已付款。未打勾的待付款不计入统计。</p>`}
function settingsView(){return `<h2>设定</h2><div class="panel"><h2>自定义分类</h2><div class="split"><input id="newcat" placeholder="输入新分类名称"><button class="btn" onclick="addCat()">新增</button></div>${db.categories.length?db.categories.map((c,i)=>`<div class="row"><b>${esc(c)}</b><div class="actions"><button class="btn light small" onclick="renameCat(${i})">修改</button><button class="btn outline small" onclick="removeCat(${i})">删除</button></div></div>`).join(''):'<p class="hint">还没有分类，可自行新增。</p>'}</div><div class="panel"><h2>使用说明</h2><p class="hint">收入新增后直接计入当月；支出先列付款清单，付了再打勾。每个月独立新增付款项目，不会自动带入下个月。数据自动保存在当前手机浏览器中，清除网站数据或换手机可能丢失。</p></div>`}
function addCat(){let v=$('newcat').value.trim();if(!v)return;if(db.categories.includes(v))return toast('分类已存在');db.categories.push(v);save();render()}
function renameCat(i){let old=db.categories[i],v=prompt('修改分类名称',old);if(v===null)return;v=v.trim();if(!v||db.categories.some((x,j)=>x===v&&i!==j))return toast('名称无效或重复');db.categories[i]=v;db.expenses.forEach(x=>{if(x.category===old)x.category=v});save();render()}
function removeCat(i){let old=db.categories[i];if(!confirm('删除分类「'+old+'」？付款项目不会删除。'))return;db.categories.splice(i,1);db.expenses.forEach(x=>{if(x.category===old)x.category=''});save();render()}
function exportReceipt(type){let yy=type==='year'?annualYear:year,mm=month,ss=type==='year'?Array.from({length:12},(_,i)=>summary(yy,i+1)):null,rows=type==='year'?ss.map((x,i)=>[`${i+1}月`,x.income,x.paid,x.balance]):[...incFor(yy,mm).map(x=>['收入 · '+x.name,x.amount,0,x.amount]),...expFor(yy,mm).filter(x=>isPaid(x,yy,mm)).map(x=>[x.name,0,amountFor(x,yy,mm),-amountFor(x,yy,mm)])];let totals=type==='year'?ss.reduce((a,x)=>({income:a.income+x.income,paid:a.paid+x.paid,balance:a.balance+x.balance}),{income:0,paid:0,balance:0}):summary(yy,mm);let canvas=document.createElement('canvas'),w=900,h=Math.max(650,400+rows.length*44);canvas.width=w;canvas.height=h;let c=canvas.getContext('2d');c.fillStyle='#ffffff';c.fillRect(0,0,w,h);c.fillStyle='#fce8ef';c.fillRect(0,0,w,140);c.fillStyle='#262026';c.font='bold 38px sans-serif';c.fillText('365账本 · '+(type==='year'?'年度账单':'月结账单'),45,70);c.font='24px sans-serif';c.fillText(type==='year'?yy+'年':yy+'年'+mm+'月',45,113);let y=185;c.font='24px sans-serif';for(let [label,v] of [['总收入',totals.income],['总支出',totals.paid],['余额',totals.balance]]){c.fillStyle='#555';c.fillText(label,50,y);c.fillStyle='#252025';c.textAlign='right';c.fillText(fmt(v),845,y);c.textAlign='left';y+=49}y+=25;c.fillStyle='#f4edf0';c.fillRect(40,y-34,820,46);c.fillStyle='#333';c.font='bold 19px sans-serif';c.fillText(type==='year'?'月份':'项目',50,y-4);c.fillText('收入',370,y-4);c.fillText('支出',560,y-4);c.fillText('余额变化',735,y-4);y+=38;c.font='19px sans-serif';for(let r of rows){c.fillStyle='#3c363a';let label=String(r[0]);c.fillText(label.length>15?label.slice(0,14)+'…':label,50,y);c.fillText(Number(r[1]).toFixed(2),370,y);c.fillText(Number(r[2]).toFixed(2),560,y);c.fillText(Number(r[3]).toFixed(2),735,y);c.fillStyle='#eee';c.fillRect(45,y+12,805,1);y+=44}c.fillStyle='#888';c.font='17px sans-serif';c.fillText('365账本 · 账单生成时间 '+new Date().toLocaleDateString('zh-CN'),45,h-34);canvas.toBlob(blob=>{if(!blob)return toast('生成失败');let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='365账本_'+(type==='year'?yy+'年度':yy+'年'+mm+'月')+'账单.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('账单图片已生成，请查看下载文件夹')},'image/png')}
render();</script></body></html>
